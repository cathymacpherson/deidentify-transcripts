[project]
name = "deidentify-transcripts"
version = "0.1.0"
description = "Local, review-gated transcript de-identification with Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
deidentify-transcripts = "deidentify_transcripts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deidentify_transcripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

